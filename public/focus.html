<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Photo Focus</title>
<link rel="icon" href="/img/sprigf.webp" type="image/webp">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600&display=swap">
<style>
:root{--plaster:#f7f2e4;--trim:#fbf8ef;--forest:#254641;--ink:#22332f;--muted:#5d625a;--door:#6b6a1d;--brick:#a4573f;--rule:#ddd2b6;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--plaster);color:var(--ink);font:16px/1.55 "Work Sans",system-ui,sans-serif}
header{background:var(--trim);box-shadow:0 3px 0 var(--door);position:sticky;top:0;z-index:5}
header .w{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
header img{height:38px}
header a{color:var(--forest);font-weight:500;text-decoration:none}
.w{max-width:1100px;margin:0 auto;padding-inline:16px}
h1{font:300 2.8rem/1.05 "Work Sans",sans-serif;letter-spacing:-.035em;color:var(--forest);margin:34px 0 8px}
.lead{color:var(--muted);max-width:62ch;margin:0 0 28px}
.lead a{color:var(--forest)}
.item{background:var(--trim);box-shadow:inset 0 0 0 1px rgba(92,74,38,.25);padding:20px;margin-bottom:24px;display:grid;gap:20px}
@media(min-width:860px){.item{grid-template-columns:1.1fr 1fr}}
.item h2{font:400 1.6rem/1.1 "Work Sans",sans-serif;letter-spacing:-.02em;color:var(--forest);margin:0 0 4px}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.stage{max-width:560px;position:relative;cursor:crosshair;line-height:0;user-select:none;touch-action:none}
.stage img{width:100%;height:auto;display:block}
.dot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--brick),0 2px 8px rgba(0,0,0,.4);pointer-events:none}
.dot::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--brick)}
.previews{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:12px;align-items:end}
.pv{display:flex;flex-direction:column;gap:6px}
.pv div{overflow:hidden;box-shadow:0 0 0 1px rgba(92,74,38,.25)}
.pv img{width:100%;height:100%;object-fit:cover;display:block}
.pv small{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.val{font:600 .95rem "Work Sans";color:var(--forest);background:#efe7d0;padding:6px 10px}
button{font:600 .82rem "Work Sans";letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--door);background:transparent;color:var(--door);min-height:40px;padding:0 16px;border-radius:3px;cursor:pointer}
button.primary{background:var(--door);color:#f6f1df}
.status{font-size:.88rem;font-weight:600;color:var(--door)}
.status.err{color:var(--brick)}
.pw{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--trim);box-shadow:inset 0 0 0 1px rgba(92,74,38,.25);padding:14px 16px;margin:0 0 24px}
.pw label{font-weight:600;color:var(--forest)}
.pw input{font:inherit;min-height:44px;border:1.5px solid var(--rule);border-radius:3px;padding:8px 12px;background:#fff;min-width:200px}
.pw small{color:var(--muted)}
.pw[hidden]{display:none}
</style>
</head>
<body>
<header><div class="w"><a href="/#flowers"><img src="/img/logo.webp" alt="Studio Seven"></a><a href="/#flowers">Back to the shop</a></div></header>
<main class="w">
  <h1>Photo focus</h1>
  <p class="lead">Tap the part of each photo that should always stay in view, then press Save. The previews show how it will be cropped on a phone, in a square and in a wide banner. Saved spots show for everyone on the website within about a minute.</p>
  <form class="pw" id="pwForm" hidden><label for="pw">Staff password</label><input id="pw" type="password" autocomplete="current-password"><small>Needed once on this device.</small></form>
  <div id="list"></div>
</main>
<script>
(async function(){
  const PW="s7-staff";
  const getPw=()=>{try{return localStorage.getItem(PW)||""}catch(e){return ""}};
  const setPw=v=>{try{v?localStorage.setItem(PW,v):localStorage.removeItem(PW)}catch(e){}};
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const list=document.getElementById("list"), form=document.getElementById("pwForm"), pwIn=document.getElementById("pw");
  form.hidden=!!getPw();
  form.addEventListener("submit",e=>e.preventDefault());
  let M;try{const r=await fetch("/api/menu",{cache:"no-store"});if(!r.ok)throw 0;M=await r.json()}catch(e){list.innerHTML='<p class="lead">The menu did not load. Please refresh.</p>';return}
  const items=M.flowers.items.filter(f=>f.img);
  if(!items.length){list.innerHTML='<p class="lead">No flower photos yet. Add photos to your items in Square and they will appear here.</p>';return}
  const draft=items.map(f=>f.focus||"50% 50%");
  list.innerHTML=items.map((f,i)=>`
    <section class="item" data-i="${i}">
      <div>
        <h2>${esc(f.n)}</h2>
        <p class="hint">Tap the photo to move the focus spot.</p>
        <div class="stage"><img src="${esc(f.img)}" alt="${esc(f.n)}" draggable="false"><span class="dot"></span></div>
      </div>
      <div>
        <div class="previews">
          <div class="pv"><div style="aspect-ratio:4/5"><img src="${esc(f.img)}" alt=""></div><small>Phone</small></div>
          <div class="pv"><div style="aspect-ratio:1/1"><img src="${esc(f.img)}" alt=""></div><small>Square</small></div>
          <div class="pv"><div style="aspect-ratio:16/9"><img src="${esc(f.img)}" alt=""></div><small>Wide</small></div>
        </div>
        <div class="row"><span class="val"></span><button type="button" class="primary save">Save</button><button type="button" class="reset">Centre</button></div>
        <p class="status" role="status"></p>
      </div>
    </section>`).join("");
  function paint(sec){
    const p=draft[sec.dataset.i],[x,y]=p.split(" ");
    const d=sec.querySelector(".dot");d.style.left=x;d.style.top=y;
    sec.querySelectorAll(".pv img").forEach(im=>im.style.objectPosition=p);
    sec.querySelector(".val").textContent="Focus: "+p;
  }
  function status(sec,msg,err){const s=sec.querySelector(".status");s.textContent=msg;s.classList.toggle("err",!!err)}
  async function save(sec){
    const i=+sec.dataset.i, pw=getPw()||pwIn.value.trim();
    if(!pw){form.hidden=false;pwIn.focus();status(sec,"Enter the staff password above, then press Save again.",true);return}
    const btn=sec.querySelector(".save");btn.disabled=true;status(sec,"Saving…");
    try{
      const r=await fetch("/api/focus",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw,itemId:items[i].id,focus:draft[i]})});
      const out=await r.json().catch(()=>({}));
      if(r.ok){setPw(pw);form.hidden=true;status(sec,"Saved. It shows for everyone within about a minute.")}
      else{if(r.status===401){setPw("");form.hidden=false;pwIn.value="";pwIn.focus()}status(sec,out.error||"That didn't save. Please try again.",true)}
    }catch(e){status(sec,"That didn't save. Check your connection and try again.",true)}
    btn.disabled=false;
  }
  document.querySelectorAll(".item").forEach(sec=>{
    paint(sec);
    const st=sec.querySelector(".stage");
    const pick=e=>{const r=st.getBoundingClientRect();
      const x=Math.round(Math.min(100,Math.max(0,(e.clientX-r.left)/r.width*100)));
      const y=Math.round(Math.min(100,Math.max(0,(e.clientY-r.top)/r.height*100)));
      draft[sec.dataset.i]=x+"% "+y+"%";paint(sec);status(sec,"Not saved yet.")};
    let down=false;
    st.addEventListener("pointerdown",e=>{down=true;st.setPointerCapture(e.pointerId);pick(e)});
    st.addEventListener("pointermove",e=>{if(down)pick(e)});
    st.addEventListener("pointerup",()=>down=false);
    sec.querySelector(".reset").addEventListener("click",()=>{draft[sec.dataset.i]="50% 50%";paint(sec);status(sec,"Not saved yet.")});
    sec.querySelector(".save").addEventListener("click",()=>save(sec));
  });
})();
</script>
</body>
</html>
